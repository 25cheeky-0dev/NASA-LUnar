[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wispr-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "truststore>=0.10,<1", "numpy>=2,<3", "pyarrow>=18,<27", "pyproj>=3.7,<4", "astropy-healpix>=1.1,<3", "shapely>=2.0,<3", "rasterio>=1.4,<2", "duckdb>=1.2,<2", "psutil>=6,<8"]

[project.optional-dependencies]
celestial = ["pyarrow>=18,<27"]
lint = ["ruff>=0.11,<1"]
test = ["pytest>=8,<10"]
terrain = ["rasterio>=1.4,<2", "pyproj>=3.7,<4", "numpy>=2,<3"]
global = ["astropy-healpix>=1.1,<3", "shapely>=2.0,<3", "rasterio>=1.4,<2", "duckdb>=1.2,<2", "psutil>=6,<8"]

[tool.setuptools.packages.find]
include = ["app*", "celestial_engine*", "lunar_global*"]

[tool.pytest.ini_options]
testpaths = ["tests", "celestial_engine/tests", "lunar_global/tests"]
addopts = "--import-mode=importlib"
markers = ["live: opt-in real NASA network integration"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
celestial_engine = ["fixtures/*.json", "README.md", "HANDOFF.md"]
